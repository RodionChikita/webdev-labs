{% extends "base.html" %}
{% block title %}Отчёт по страницам{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col">
            <h1>Отчёт по страницам</h1>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>№</th>
                            <th>Страница</th>
                            <th>Количество посещений</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for path, count in page_stats %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ path }}</td>
                            <td>{{ count }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="mt-4">
                <a href="{{ url_for('reports.export_pages') }}" class="btn btn-success">Экспорт в CSV</a>
                <a href="{{ url_for('reports.visit_logs') }}" class="btn btn-secondary">Назад к журналу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
